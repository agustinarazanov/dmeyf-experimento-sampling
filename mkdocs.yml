site_name: Sampling_1 · DMEyF 2026
site_description: Experimento Sampling_1 de DMEyF 2026. ¿Vale la pena el tradeoff entre velocidad y pérdida de performance?
repo_url: https://github.com/agustinarazanov/dmeyf-experimento-sampling
edit_uri: ""

# La raíz del repo es el docs_dir (mkdocs-same-dir): cada página está en la ruta de su archivo.
docs_dir: .
site_dir: site

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - content.tabs.link

extra_css:
  - sitio/estilos.css

# Tablas ordenables y filtrables (D17): tablesort desde unpkg, con versión fija, y sitio/tablas.js.
extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.number.min.js
  - sitio/tablas.js

plugins:
  - same-dir
  - search:
      lang: es
  # Clic en una figura: se abre a pantalla completa con zoom (D17). Sin leyenda: el título ya está en la figura.
  - glightbox:
      auto_caption: false
      zoomable: true

hooks:
  - sitio/hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

# Se publica solo lo que está en esta lista (estilo gitignore: se excluye todo y se vuelve a incluir; assets/ son
# los archivos del tema, que MkDocs filtra con la misma lista).
# Bitácoras, specs, Zulip, código, ledgers y plantilla quedan fuera; se enlazan en GitHub desde «Cómo trabajamos».
exclude_docs: |
  *
  !/assets/**
  !/index.md
  !/sitio/estilos.css
  !/sitio/tablas.js
  !/sitio/hipotesis/README.md
  !/sitio/como-medimos/README.md
  !/experimentos/sampling_1/README.md
  !/experimentos/sampling_1/anexo.md
  !/experimentos/sampling_1/figuras/**
  !/experimentos/sampling_1/corridas.md
  !/experimentos/sampling_1/exploratorios/README.md
  !/experimentos/control/README.md
  !/experimentos/h1/README.md
  !/experimentos/h1/figuras/**
  !/experimentos/h2/README.md
  !/experimentos/h2/figuras/**
  !/experimentos/h3/README.md
  !/experimentos/h3/figuras/**
  !/experimentos/h4/README.md
  !/experimentos/h4/figuras/**
  !/docs/metodo.md
  !/experimentos/**/figuras/**

nav:
  - Inicio: index.md
  - Resultados:
    - experimentos/sampling_1/README.md
    - experimentos/sampling_1/anexo.md
  - Hipótesis:
    - sitio/hipotesis/README.md
    - experimentos/h1/README.md
    - experimentos/h2/README.md
    - experimentos/h3/README.md
    - experimentos/h4/README.md
  - Cómo medimos:
    - sitio/como-medimos/README.md
    - experimentos/control/README.md
    - experimentos/sampling_1/corridas.md
    - experimentos/sampling_1/exploratorios/README.md
  - Cómo trabajamos: docs/metodo.md

validation:
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: warn
    anchors: warn
