name: Sitio (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-sitio.txt
      - run: pip install -r requirements-sitio.txt
      - name: Construir y verificar enlaces y nombres
        run: scripts/sitio.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Desde una rama (workflow_dispatch) solo se construye y verifica; se publica desde main.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
